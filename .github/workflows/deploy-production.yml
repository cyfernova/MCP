name: Deploy Production

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/deploy-production.yml"
      - "Dockerfile.lambda"
      - "cmd/**"
      - "internal/**"
      - "go.mod"
      - "go.sum"
      - "infra/terraform/**"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: production-mcp-deploy
  cancel-in-progress: false

env:
  TF_IN_AUTOMATION: "true"
  TF_VAR_aws_region: ${{ vars.AWS_REGION }}
  TF_VAR_expected_aws_account_id: ${{ vars.AWS_ACCOUNT_ID }}
  TF_VAR_name: ${{ vars.MCP_NAME }}
  TF_VAR_backend_base_url: ${{ vars.MCP_BACKEND_BASE_URL }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production

    steps:
      - uses: actions/checkout@v4

      - name: Verify production configuration
        env:
          AWS_DEPLOY_ROLE_ARN: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          TF_STATE_BUCKET: ${{ vars.TF_STATE_BUCKET }}
        run: |
          for name in AWS_DEPLOY_ROLE_ARN TF_STATE_BUCKET TF_VAR_aws_region TF_VAR_expected_aws_account_id TF_VAR_name TF_VAR_backend_base_url; do
            if [ -z "${!name}" ]; then
              echo "Missing required GitHub Actions variable: ${name#TF_VAR_}"
              exit 1
            fi
          done

      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - uses: hashicorp/setup-terraform@v4

      - name: Initialize and validate Terraform
        working-directory: infra/terraform
        env:
          TF_STATE_BUCKET: ${{ vars.TF_STATE_BUCKET }}
        run: |
          terraform init -input=false \
            -backend-config="bucket=${TF_STATE_BUCKET}" \
            -backend-config="key=production/mcp/terraform.tfstate" \
            -backend-config="region=${TF_VAR_aws_region}" \
            -backend-config="use_lockfile=true" \
            -backend-config="encrypt=true"
          terraform fmt -check
          terraform validate

      # ECR must exist before Docker can push. A placeholder image URI is safe
      # because the targeted operation does not create the Lambda function.
      - name: Ensure ECR repository exists
        working-directory: infra/terraform
        run: |
          terraform apply -auto-approve -input=false \
            -target=aws_ecr_repository.mcp \
            -target=aws_ecr_lifecycle_policy.mcp \
            -var="image_uri=bootstrap"

      - name: Authenticate Docker to ECR
        id: ecr
        working-directory: infra/terraform
        run: |
          repository="$(terraform output -raw ecr_repository_url)"
          echo "repository=${repository}" >> "$GITHUB_OUTPUT"
          aws ecr get-login-password --region "$TF_VAR_aws_region" | docker login --username AWS --password-stdin "${repository%/*}"

      - name: Build and push Lambda image
        env:
          REPOSITORY: ${{ steps.ecr.outputs.repository }}
        run: |
          docker build --platform linux/amd64 --file Dockerfile.lambda --tag "${REPOSITORY}:${GITHUB_SHA}" .
          docker push "${REPOSITORY}:${GITHUB_SHA}"

      - name: Deploy immutable Lambda image
        working-directory: infra/terraform
        env:
          REPOSITORY: ${{ steps.ecr.outputs.repository }}
        run: |
          digest="$(aws ecr describe-images --repository-name "$TF_VAR_name" --image-ids imageTag="$GITHUB_SHA" --query 'imageDetails[0].imageDigest' --output text)"
          image_uri="${REPOSITORY}@${digest}"
          terraform plan -input=false -out=tfplan -var="image_uri=${image_uri}"
          terraform apply -input=false -auto-approve tfplan
