name: Bootstrap Terraform State

on:
  workflow_dispatch:
    inputs:
      aws_region:
        description: AWS region for the state resources
        required: true
        default: us-east-1
        type: string
      state_bucket_name:
        description: Globally unique S3 bucket name for Terraform state
        required: true
        type: string

permissions:
  contents: read
  id-token: write

jobs:
  bootstrap:
    name: Create and migrate Terraform state
    runs-on: ubuntu-latest
    environment: production
    concurrency:
      group: terraform-state-bootstrap
      cancel-in-progress: false

    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v4

      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ inputs.aws_region }}

      # The first init intentionally uses local state. After creating the
      # bucket, the second init migrates that state into S3.
      - name: Create remote-state resources
        working-directory: infra/bootstrap
        run: |
          terraform init -backend=false -input=false
          terraform apply -auto-approve -input=false \
            -var="aws_region=${{ inputs.aws_region }}" \
            -var="state_bucket_name=${{ inputs.state_bucket_name }}"

      - name: Migrate bootstrap state to S3
        working-directory: infra/bootstrap
        run: |
          terraform init -migrate-state -force-copy -input=false \
            -backend-config="bucket=${{ inputs.state_bucket_name }}" \
            -backend-config="key=bootstrap/terraform.tfstate" \
            -backend-config="region=${{ inputs.aws_region }}" \
            -backend-config="use_lockfile=true" \
            -backend-config="encrypt=true"
